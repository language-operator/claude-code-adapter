name: Test

env:
  # Must match the base pinned in the Dockerfile.
  CODING_RUNTIME_VERSION: v0.1.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: claude-code-adapter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fetches the shared suite at the pinned tag and runs the image under the
      # posture the operator imposes and an adapter cannot override: read-only
      # root, uid 1000, all capabilities dropped, tmpfs /tmp. Checks doctor, that
      # seeding is idempotent and writes nothing outside /tmp and /workspace, the
      # probe endpoints, manifest redaction, and the cross-origin WebSocket guard.
      # See the script for the one check it tolerates, and why.
      - name: Run conformance suite
        run: ./hack/conformance.sh claude-code-adapter:test

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Lint chart
        run: helm lint chart

      - name: Template chart
        run: helm template claude-code chart
